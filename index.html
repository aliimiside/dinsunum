<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melek'e Özel ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            height: 100vh;
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: #e91e63;
            pointer-events: none;
            z-index: 10;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .container-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.2);
            text-align: center;
            max-width: 90%;
            width: 450px;
            transition: all 0.5s ease;
        }

        .btn-yes {
            background-color: #e91e63;
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #d81b60;
        }

        .message-title {
            color: #ad1457;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .hidden {
            display: none;
        }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(233, 30, 99, 0.1);
            z-index: -1;
            animation: backgroundFloat 20s infinite linear;
        }

        @keyframes backgroundFloat {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-10vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="background-hearts"></div>

    <div class="container-box" id="main-card">
        <div id="question-section">
            <h1 class="text-4xl romantic-font message-title">Benimle çıkar mısınız hanımefendi?</h1>
            <button onclick="acceptProposal()" class="btn-yes">Evet ❤️</button>
        </div>

        <div id="result-section" class="hidden">
            <h1 class="text-5xl romantic-font message-title">Artık benim karımsın ❤️</h1>
            <p class="text-pink-600 mt-4 text-lg">Seni çok seviyorum askim!</p>
        </div>
    </div>

    <script>
        // Create background floating hearts
        function createBackgroundHearts() {
            const container = document.getElementById('background-hearts');
            const heartIcons = ['❤️', '💖', '💗', '💕', '🌸'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(heart);
            }
        }

        function acceptProposal() {
            // Change UI
            document.getElementById('question-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            
            // Trigger explosion of hearts
            const interval = setInterval(() => {
                createHeart();
            }, 50);

            // Stop after 5 seconds to prevent performance issues
            setTimeout(() => {
                clearInterval(interval);
            }, 6000);
            
            // Initial burst
            for(let i=0; i<50; i++) {
                setTimeout(createHeart, i * 20);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Random heart symbol
            const hearts = ['❤️', '💖', '💗', '💓', '💕'];
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            // Random position
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "100vh";
            
            // Random size
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            
            // Random animation duration
            heart.style.animationDuration = Math.random() * 2 + 2 + "s";
            
            document.body.appendChild(heart);
            
            // Remove from DOM after animation
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        createBackgroundHearts();
    </script>
</body>
</html>
